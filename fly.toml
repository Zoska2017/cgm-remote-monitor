# fly.toml app configuration file generated for zoska on 2025-09-19T19:11:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zoska'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 1337
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
